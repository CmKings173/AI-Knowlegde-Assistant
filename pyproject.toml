[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "Internal AI Knowledge Assistant with dynamic document ingestion, Qdrant retrieval, and local Ollama generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.2",
    "qdrant-client>=1.11.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.37.0",
]

[project.scripts]
api = "main:run_api"
ui = "ui:run_ui"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
